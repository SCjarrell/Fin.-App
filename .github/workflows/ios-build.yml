name: iOS Build & Test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devicetypes

      - name: Build and test
        working-directory: DebtCompass
        run: |
          set -o pipefail
          xcodebuild \
            -project DebtCompass.xcodeproj \
            -scheme DebtCompass \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            clean build test \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | (command -v xcbeautify >/dev/null && xcbeautify || cat)

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: DebtCompass/build.log
