name: iOS Build & Test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find an installed, bootable iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      candidates.append((runtime, d))
          if not candidates:
              sys.exit('No available iOS iPhone simulator found on this runner')
          # Prefer the newest iOS runtime available.
          candidates.sort(key=lambda c: c[0])
          runtime, device = candidates[-1]
          name = device['name']
          print('Using', repr(name), 'on', runtime, file=sys.stderr)
          print(device['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: DebtCompass
        run: |
          set -o pipefail
          xcodebuild \
            -project DebtCompass.xcodeproj \
            -scheme DebtCompass \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            clean build test \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | (command -v xcbeautify >/dev/null && xcbeautify || cat)

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: DebtCompass/build.log
